<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>解放清华园 · 联机大厅</title>
  <style>
    :root{color-scheme:dark;--ink:#07100e;--panel:#0e1b17ed;--gold:#efd06f;--muted:#9eaa9f;--red:#df3f59;--purple:#ad67d5;--line:#ffffff1b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 12%,#2b3421 0,transparent 32%),radial-gradient(circle at 82% 25%,#281737 0,transparent 34%),linear-gradient(135deg,#06100d,#111816 55%,#09070d);color:#f4edd6;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{border:1px solid #d6b858;background:#28342d;color:#fff0b4;border-radius:9px;padding:10px 16px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #080d0b}button:hover{filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}.shell{width:min(1120px,94vw);margin:auto;padding:36px 0 60px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #cdb55b55;padding-bottom:20px}.eyebrow{color:var(--gold);letter-spacing:.18em;font-size:12px}.hero h1{font-size:clamp(34px,7vw,72px);margin:2px 0;line-height:1}.hero p{color:var(--muted);margin:8px 0 0}.pill{border:1px solid #dbc55e;border-radius:99px;padding:8px 14px;color:#ffe89b;background:#0a1512}.panel{margin-top:22px;border:1px solid #d7c16a55;border-radius:15px;background:var(--panel);box-shadow:0 24px 80px #0008;padding:22px;backdrop-filter:blur(12px)}.auth{width:min(520px,100%);margin:70px auto}.auth h2,.panel h2{margin:0 0 14px}.grid{display:grid;gap:13px}.auth-tabs{display:flex;gap:8px;margin-bottom:16px}.auth-tabs button.active{background:#765b19}.field{display:grid;gap:5px;color:#d8dfd4}.field input,.field select{width:100%;border:1px solid #cfba6a66;border-radius:9px;background:#07110e;color:#fff3c2;padding:12px;outline:none}.field input:focus,.field select:focus{border-color:#f3d66c;box-shadow:0 0 0 3px #e8c84b22}.error{min-height:24px;color:#ff8293}.hidden{display:none!important}.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:20px}.profile{grid-column:1/-1}.profile-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.schools{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.school{border:1px solid var(--line);border-radius:13px;padding:17px;background:#07110e}.school.pku{border-left:5px solid var(--red)}.school.thu{border-left:5px solid var(--purple)}.school header{display:flex;justify-content:space-between;font-size:19px;font-weight:900}.bar{height:9px;border-radius:99px;background:#26302c;overflow:hidden;margin:12px 0 7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e45162,#f2ce68)}.thu .bar i{background:linear-gradient(90deg,#8d4db7,#deb1f5)}.muted{color:var(--muted);font-size:13px}.lobby-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode{border:1px solid var(--line);border-radius:12px;padding:15px;background:#08120f}.mode strong{display:block;color:#ffe39a}.mode small{display:block;color:var(--muted);min-height:42px;margin:5px 0 10px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.inventory{display:flex;flex-wrap:wrap;gap:9px}.item{border:1px solid #d8bf6755;border-radius:10px;padding:9px 11px;background:#17231d}.item button{padding:5px 9px;margin-left:7px;box-shadow:none}.notice{position:fixed;right:18px;bottom:18px;max-width:360px;border:1px solid var(--gold);background:#0e1b17f5;border-radius:10px;padding:12px 15px;box-shadow:0 16px 50px #000b;transform:translateY(140%);transition:.2s}.notice.show{transform:none}@media(max-width:780px){.dashboard{grid-template-columns:1fr}.profile{grid-column:auto}.schools,.lobby-grid{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.shell{padding-top:22px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="hero"><div><span class="eyebrow">QINGBEI ONLINE COMMAND</span><h1>联机与成长大厅</h1><p>统一账号、匹配、人机挑战与阵营饰品。</p></div><span class="pill" id="serverState">服务器已连接</span></header>
  <section class="panel auth" id="authPanel">
    <div class="auth-tabs"><button id="loginTab" class="active">登录</button><button id="registerTab">注册</button></div>
    <h2 id="authTitle">进入个人主页</h2>
    <form class="grid" id="authForm"><label class="field">玩家 ID<input id="userId" autocomplete="username" maxlength="24" placeholder="3—24位字母、数字或下划线" /></label><label class="field">密码<input id="password" type="password" autocomplete="current-password" maxlength="72" placeholder="至少6位" /></label><button type="submit" id="authSubmit">登录</button><div class="error" id="authError"></div></form>
  </section>
  <section class="dashboard hidden" id="dashboard">
    <article class="panel profile"><div class="profile-head"><div><span class="eyebrow">PLAYER PROFILE</span><h2 id="profileId">—</h2></div><button id="logout">退出登录</button></div><div class="schools"><div class="school pku"><header><span>北京大学</span><b id="pkuLevel">Lv.1</b></header><div class="bar"><i id="pkuBar"></i></div><span class="muted" id="pkuXp">0 EXP</span></div><div class="school thu"><header><span>清华大学</span><b id="thuLevel">Lv.1</b></header><div class="bar"><i id="thuBar"></i></div><span class="muted" id="thuXp">0 EXP</span></div></div></article>
    <article class="panel"><h2>联机匹配</h2><p class="muted">自动匹配另一名在线玩家，双方各自操作一个阵营。</p><label class="field">阵营偏好<select id="pvpTeam"><option value="any">自动分配</option><option value="pku">北京大学</option><option value="thu">清华大学</option></select></label><button id="pvpQueue">加入匹配</button><p class="muted" id="queueState"></p></article>
    <article class="panel"><h2>人机挑战</h2><div class="form-row"><label class="field">操作阵营<select id="aiTeam"><option value="pku">北京大学</option><option value="thu">清华大学</option></select></label><label class="field">倍速卡<select id="speedCard"><option value="">不使用</option></select></label></div><div class="lobby-grid"><div class="mode"><strong>休闲</strong><small>胜利30经验，失败15经验。</small><button data-ai="casual">创建战局</button></div><div class="mode"><strong>标准</strong><small>胜利60经验，失败30经验。</small><button data-ai="standard">创建战局</button></div><div class="mode"><strong>困难</strong><small>胜利100经验，失败50经验。</small><button data-ai="hard">创建战局</button></div></div></article>
    <article class="panel"><h2>倍速卡</h2><div class="inventory" id="cards"></div><p class="muted">创建人机战局时消耗；只改变该独立内核的推演速度。</p></article>
    <article class="panel"><h2>阵营饰品</h2><div class="inventory" id="cosmetics"></div><p class="muted">装备后，仅在加入对应阵营时替换该阵营的球体材质。</p></article>
  </section>
</main><aside class="notice" id="notice"></aside>
<script>
const $=id=>document.getElementById(id), api=(path,options={})=>fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options}).then(async r=>{const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'请求失败');return data});let mode='login',token='',poll=null;const thresholds=[0,100,250,500,900,1400];
function toast(text){$('notice').textContent=text;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),3200)}
function setMode(next){mode=next;$('loginTab').classList.toggle('active',next==='login');$('registerTab').classList.toggle('active',next==='register');$('authTitle').textContent=next==='login'?'进入个人主页':'创建玩家账号';$('authSubmit').textContent=next==='login'?'登录':'注册';$('password').autocomplete=next==='login'?'current-password':'new-password'}
function progress(xp,level){const from=thresholds[level-1]||0,to=thresholds[level]||from+500;return Math.max(0,Math.min(100,(xp-from)/(to-from)*100))}
function render(profile){$('authPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('profileId').textContent=profile.id;for(const team of ['pku','thu']){const xp=profile.experience[team]||0,level=profile.levels[team]||1;$(team+'Level').textContent='Lv.'+level;$(team+'Xp').textContent=xp+' EXP';$(team+'Bar').style.width=progress(xp,level)+'%'}const cards=profile.speedCards||{};$('cards').innerHTML=['2x','4x'].map(card=>`<span class="item">${card} 倍速卡 × ${cards[card]||0}</span>`).join('');$('speedCard').innerHTML='<option value="">不使用</option>'+['2x','4x'].filter(c=>cards[c]>0).map(c=>`<option value="${c}">${c}（剩余${cards[c]}）</option>`).join('');const selected=profile.selectedCosmetics||{},items=profile.cosmetics||[];$('cosmetics').innerHTML=items.length?items.map(item=>{const team=item.startsWith('pku')?'pku':'thu',equipped=selected[team]===item;return `<span class="item">${item.replace('pku','北大').replace('thu','清华').replace('bronze','铜色').replace('gold','金色')}<button data-cosmetic="${item}" ${equipped?'disabled':''}>${equipped?'已装备':'装备'}</button></span>`}).join(''):'<span class="muted">提升阵营等级后解锁饰品。</span>';document.querySelectorAll('[data-cosmetic]').forEach(button=>button.onclick=()=>api('api/cosmetic',{method:'POST',body:JSON.stringify({item:button.dataset.cosmetic})}).then(r=>{render(r.profile);toast('饰品已装备')}).catch(e=>toast(e.message)))}
async function refresh(){try{const result=await api('api/me');token=result.token;render(result.profile)}catch{$('authPanel').classList.remove('hidden');$('dashboard').classList.add('hidden')}}
$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('authForm').onsubmit=async event=>{event.preventDefault();$('authError').textContent='';try{const result=await api('api/'+mode,{method:'POST',body:JSON.stringify({id:$('userId').value,password:$('password').value})});token=result.token;render(result.profile)}catch(error){$('authError').textContent=error.message}};$('logout').onclick=()=>api('api/logout',{method:'POST'}).finally(()=>location.reload());
document.querySelectorAll('[data-ai]').forEach(button=>button.onclick=async()=>{button.disabled=true;try{const result=await api('api/lobby/ai',{method:'POST',body:JSON.stringify({difficulty:button.dataset.ai,team:$('aiTeam').value,card:$('speedCard').value})});location.href=result.joinUrl}catch(error){toast(error.message);button.disabled=false}});
$('pvpQueue').onclick=async()=>{try{const result=await api('api/lobby/pvp',{method:'POST',body:JSON.stringify({preferredTeam:$('pvpTeam').value})});if(result.joinUrl){location.href=result.joinUrl;return}$('queueState').textContent='正在等待另一名玩家…';$('pvpQueue').disabled=true;clearInterval(poll);poll=setInterval(async()=>{try{const state=await api('api/lobby/status');if(state.joinUrl)location.href=state.joinUrl}catch{}},1500)}catch(error){toast(error.message)}};refresh();
</script></body></html>
