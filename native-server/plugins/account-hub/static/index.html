<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>解放清华园 · 联机大厅</title>
  <style>
    :root{color-scheme:dark;--ink:#07100e;--panel:#0e1b17ed;--gold:#efd06f;--muted:#9eaa9f;--red:#df3f59;--purple:#ad67d5;--line:#ffffff1b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 12%,#2b3421 0,transparent 32%),radial-gradient(circle at 82% 25%,#281737 0,transparent 34%),linear-gradient(135deg,#06100d,#111816 55%,#09070d);color:#f4edd6;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{border:1px solid #d6b858;background:#28342d;color:#fff0b4;border-radius:9px;padding:10px 16px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #080d0b}button:hover{filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}.shell{width:min(1180px,94vw);margin:auto;padding:36px 0 60px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #cdb55b55;padding-bottom:20px}.eyebrow{color:var(--gold);letter-spacing:.18em;font-size:12px}.hero h1{font-size:clamp(34px,7vw,72px);margin:2px 0;line-height:1}.hero p{color:var(--muted);margin:8px 0 0}.pill{border:1px solid #dbc55e;border-radius:99px;padding:8px 14px;color:#ffe89b;background:#0a1512}.panel{margin-top:22px;border:1px solid #d7c16a55;border-radius:15px;background:var(--panel);box-shadow:0 24px 80px #0008;padding:22px;backdrop-filter:blur(12px)}.auth{width:min(520px,100%);margin:70px auto}.auth h2,.panel h2{margin:0 0 14px}.grid{display:grid;gap:13px}.auth-tabs,.battle-tabs{display:flex;gap:8px}.auth-tabs{margin-bottom:16px}.auth-tabs button.active,.battle-tabs button.active{background:#765b19;border-color:#f2d26d;color:#fff6cf}.field{display:grid;gap:5px;color:#d8dfd4}.field input,.field select{width:100%;border:1px solid #cfba6a66;border-radius:9px;background:#07110e;color:#fff3c2;padding:12px;outline:none}.field input:focus,.field select:focus{border-color:#f3d66c;box-shadow:0 0 0 3px #e8c84b22}.error{min-height:24px;color:#ff8293}.hidden{display:none!important}.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:20px}.profile,.battle-panel{grid-column:1/-1}.profile-head,.battle-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.schools{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.school{border:1px solid var(--line);border-radius:13px;padding:17px;background:#07110e}.school.pku{border-left:5px solid var(--red)}.school.thu{border-left:5px solid var(--purple)}.school header{display:flex;justify-content:space-between;font-size:19px;font-weight:900}.bar{height:9px;border-radius:99px;background:#26302c;overflow:hidden;margin:12px 0 7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e45162,#f2ce68)}.thu .bar i{background:linear-gradient(90deg,#8d4db7,#deb1f5)}.muted{color:var(--muted);font-size:13px}.battle-panel{padding:0;overflow:hidden}.battle-head{padding:20px 22px;border-bottom:1px solid #dbc56733;background:linear-gradient(90deg,#4c351d55,#111916 45%,#38204455)}.battle-tabs button{min-width:120px;box-shadow:none}.battle-board{position:relative;display:grid;grid-template-columns:minmax(250px,1fr) minmax(270px,.75fr) minmax(250px,1fr);gap:20px;padding:28px;background:linear-gradient(90deg,#38151d42,transparent 42%,transparent 58%,#2d193d42)}.side-choice{display:grid;align-content:start;gap:10px}.side-choice h3,.battle-command h3{margin:0;color:#f7dea0}.faction-card{position:relative;display:grid;grid-template-columns:82px 1fr;gap:14px;align-items:center;width:100%;min-height:142px;padding:18px;text-align:left;border:2px solid #ffffff20;border-radius:14px;background:#08120f;box-shadow:0 10px 0 #050908}.faction-card.pku{--school:#db3c54}.faction-card.thu{--school:#a55ccb}.faction-card.selected{border-color:var(--school);background:linear-gradient(135deg,color-mix(in srgb,var(--school) 25%,#0a1411),#0a1411);box-shadow:0 0 0 3px color-mix(in srgb,var(--school) 22%,transparent),0 10px 0 #050908}.seal{display:grid;width:76px;height:76px;place-items:center;border:5px solid #f9e8ae;border-radius:50%;background:#101714;color:#fff0bc;font-size:38px;font-weight:900}.faction-card strong{display:block;font-size:23px}.faction-card small{color:#aeb8ae}.faction-card b{position:absolute;right:16px;top:13px;color:var(--school);font-size:18px}.auto-team{width:100%;box-shadow:none;background:#111b17}.auto-team.selected{border-color:#f0cd65;background:#67501c}.battle-command{display:grid;align-content:start;gap:16px;padding:18px;border:1px solid #ffffff15;border-radius:14px;background:#07110ee8}.command-mark{display:grid;width:72px;height:72px;margin:0 auto;place-items:center;border:2px solid #e4c75f;border-radius:50%;color:#f4d56f;font-size:23px;font-weight:900;box-shadow:0 0 30px #d0ae3c22}.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.difficulty button{padding:8px 4px;box-shadow:none;background:#14201b}.difficulty button.active{border-color:#f0cd65;background:#6d541d}.battle-action{min-height:56px;background:linear-gradient(#8b6c22,#634a16);font-size:20px;letter-spacing:.08em}.queue-state{min-height:24px;margin:0;text-align:center;color:#d7dece}.reward-line{display:flex;justify-content:center;gap:12px;color:#b8c1b8;font-size:12px}.inventory{display:flex;flex-wrap:wrap;gap:9px}.item{border:1px solid #d8bf6755;border-radius:10px;padding:9px 11px;background:#17231d}.item button{padding:5px 9px;margin-left:7px;box-shadow:none}.notice{position:fixed;z-index:10;right:18px;bottom:18px;max-width:360px;border:1px solid var(--gold);background:#0e1b17f5;border-radius:10px;padding:12px 15px;box-shadow:0 16px 50px #000b;transform:translateY(140%);transition:.2s}.notice.show{transform:none}@media(max-width:900px){.battle-board{grid-template-columns:1fr}.battle-command{grid-row:3}.dashboard{grid-template-columns:1fr}.profile,.battle-panel{grid-column:auto}}@media(max-width:680px){.schools{grid-template-columns:1fr}.hero,.battle-head{align-items:start;flex-direction:column}.shell{padding-top:22px}.battle-tabs{width:100%}.battle-tabs button{min-width:0;flex:1}.battle-board{padding:16px}.faction-card{min-height:120px}.profile-head{align-items:start}}
  </style>
</head>
<body>
<main class="shell">
  <header class="hero"><div><span class="eyebrow">QINGBEI ONLINE COMMAND</span><h1>联机与成长大厅</h1><p>选择阵营，确定战斗方式，然后出发。</p></div><span class="pill" id="serverState">服务器已连接</span></header>
  <section class="panel auth" id="authPanel">
    <div class="auth-tabs"><button id="loginTab" class="active">登录</button><button id="registerTab">注册</button></div>
    <h2 id="authTitle">进入个人主页</h2>
    <form class="grid" id="authForm"><label class="field">玩家 ID<input id="userId" autocomplete="username" maxlength="24" placeholder="3—24位字母、数字或下划线" /></label><label class="field">密码<input id="password" type="password" autocomplete="current-password" maxlength="72" placeholder="至少8位" /></label><button type="submit" id="authSubmit">登录</button><div class="error" id="authError"></div></form>
  </section>
  <section class="dashboard hidden" id="dashboard">
    <article class="panel profile"><div class="profile-head"><div><span class="eyebrow">PLAYER PROFILE</span><h2 id="profileId">—</h2></div><button id="logout">退出登录</button></div><div class="schools"><div class="school pku"><header><span>北京大学</span><b id="pkuLevel">Lv.1</b></header><div class="bar"><i id="pkuBar"></i></div><span class="muted" id="pkuXp">0 EXP</span></div><div class="school thu"><header><span>清华大学</span><b id="thuLevel">Lv.1</b></header><div class="bar"><i id="thuBar"></i></div><span class="muted" id="thuXp">0 EXP</span></div></div></article>
    <article class="panel battle-panel">
      <header class="battle-head"><div><span class="eyebrow">SELECT BATTLE</span><h2>选择战斗</h2></div><nav class="battle-tabs"><button class="active" data-battle-mode="pvp">联机匹配</button><button data-battle-mode="ai">人机挑战</button></nav></header>
      <div class="battle-board">
        <section class="side-choice"><h3>北京大学</h3><button class="faction-card pku" data-team="pku"><span class="seal">北</span><span><strong>燕园阵营</strong><small>以北大经验进入战局</small></span><b id="pkuBattleLevel">Lv.1</b></button></section>
        <section class="battle-command"><div class="command-mark" id="modeMark">PvP</div><h3 id="modeTitle">联机匹配</h3><p class="muted" id="modeDetail">匹配另一名在线玩家；选择的是阵营偏好，系统会在必要时自动平衡双方。</p><button class="auto-team selected" id="autoTeam">阵营自动分配</button><div id="aiOptions" class="hidden grid"><div class="difficulty"><button data-difficulty="casual">休闲</button><button class="active" data-difficulty="standard">标准</button><button data-difficulty="hard">困难</button></div><label class="field">倍速卡<select id="speedCard"><option value="">不使用</option></select></label></div><div class="reward-line"><span id="winReward">胜方 +120 EXP</span><span id="lossReward">负方 +60 EXP</span></div><button class="battle-action" id="battleAction">开始匹配</button><p class="queue-state" id="queueState"></p></section>
        <section class="side-choice"><h3>清华大学</h3><button class="faction-card thu" data-team="thu"><span class="seal">清</span><span><strong>清华园阵营</strong><small>以清华经验进入战局</small></span><b id="thuBattleLevel">Lv.1</b></button></section>
      </div>
    </article>
    <article class="panel"><h2>倍速卡</h2><div class="inventory" id="cards"></div><p class="muted">仅可在人机战局创建时使用，只改变该独立内核的推演速度。</p></article>
    <article class="panel"><h2>阵营饰品</h2><div class="inventory" id="cosmetics"></div><p class="muted">装备后，只替换对应阵营的单位材质。</p></article>
  </section>
</main><aside class="notice" id="notice"></aside>
<script>
const $=id=>document.getElementById(id),api=(path,options={})=>fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options}).then(async response=>{const data=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(data.error||'请求失败');error.data=data;throw error}return data});let authMode='login',battleMode='pvp',selectedTeam='any',difficulty='standard',poll=null;const thresholds=[0,100,250,500,900,1400],rewards={casual:[30,15],standard:[60,30],hard:[100,50]};
function toast(text){$('notice').textContent=text;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),3200)}
function setAuthMode(next){authMode=next;$('loginTab').classList.toggle('active',next==='login');$('registerTab').classList.toggle('active',next==='register');$('authTitle').textContent=next==='login'?'进入个人主页':'创建玩家账号';$('authSubmit').textContent=next==='login'?'登录':'注册';$('password').autocomplete=next==='login'?'current-password':'new-password'}
function progress(xp,level){const from=thresholds[level-1]||0,to=thresholds[level]||from+500;return Math.max(0,Math.min(100,(xp-from)/(to-from)*100))}
function selectTeam(team){selectedTeam=team;document.querySelectorAll('[data-team]').forEach(card=>card.classList.toggle('selected',card.dataset.team===team));$('autoTeam').classList.toggle('selected',team==='any')}
function setBattleMode(next){battleMode=next;document.querySelectorAll('[data-battle-mode]').forEach(button=>button.classList.toggle('active',button.dataset.battleMode===next));const ai=next==='ai';$('aiOptions').classList.toggle('hidden',!ai);$('autoTeam').classList.toggle('hidden',ai);$('modeMark').textContent=ai?'AI':'PvP';$('modeTitle').textContent=ai?'人机挑战':'联机匹配';$('modeDetail').textContent=ai?'选择一个阵营和AI难度，创建仅属于你的独立战局。':'匹配另一名在线玩家；选择的是阵营偏好，系统会在必要时自动平衡双方。';$('battleAction').textContent=ai?'创建战局':'开始匹配';if(ai&&selectedTeam==='any')selectTeam('pku');updateReward()}
function setDifficulty(next){difficulty=next;document.querySelectorAll('[data-difficulty]').forEach(button=>button.classList.toggle('active',button.dataset.difficulty===next));updateReward()}
function updateReward(){const reward=battleMode==='pvp'?[120,60]:rewards[difficulty];$('winReward').textContent='胜方 +'+reward[0]+' EXP';$('lossReward').textContent='负方 +'+reward[1]+' EXP'}
function render(profile){if(profile.activeMatch?.joinUrl){location.replace(profile.activeMatch.joinUrl);return}$('authPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('profileId').textContent=profile.id;for(const team of ['pku','thu']){const xp=profile.experience[team]||0,level=profile.levels[team]||1;$(team+'Level').textContent='Lv.'+level;$(team+'BattleLevel').textContent='Lv.'+level;$(team+'Xp').textContent=xp+' EXP';$(team+'Bar').style.width=progress(xp,level)+'%'}const cards=profile.speedCards||{};$('cards').innerHTML=['2x','4x'].map(card=>`<span class="item">${card} 倍速卡 × ${cards[card]||0}</span>`).join('');$('speedCard').innerHTML='<option value="">不使用</option>'+['2x','4x'].filter(card=>cards[card]>0).map(card=>`<option value="${card}">${card}（剩余${cards[card]}）</option>`).join('');const selected=profile.selectedCosmetics||{},items=profile.cosmetics||[];$('cosmetics').innerHTML=items.length?items.map(item=>{const team=item.startsWith('pku')?'pku':'thu',equipped=selected[team]===item;return `<span class="item">${item.replace('pku','北大').replace('thu','清华').replace('bronze','铜色').replace('gold','金色')}<button data-cosmetic="${item}" ${equipped?'disabled':''}>${equipped?'已装备':'装备'}</button></span>`}).join(''):'<span class="muted">提升阵营等级后解锁饰品。</span>';document.querySelectorAll('[data-cosmetic]').forEach(button=>button.onclick=()=>api('api/cosmetic',{method:'POST',body:JSON.stringify({item:button.dataset.cosmetic})}).then(result=>{render(result.profile);toast('饰品已装备')}).catch(error=>toast(error.message)))}
async function refresh(){try{const result=await api('api/me');render(result.profile)}catch{$('authPanel').classList.remove('hidden');$('dashboard').classList.add('hidden')}}
async function beginBattle(){const action=$('battleAction');action.disabled=true;$('queueState').textContent='';try{if(battleMode==='ai'){const result=await api('api/lobby/ai',{method:'POST',body:JSON.stringify({difficulty,team:selectedTeam,card:$('speedCard').value})});location.href=result.joinUrl;return}const result=await api('api/lobby/pvp',{method:'POST',body:JSON.stringify({preferredTeam:selectedTeam})});if(result.joinUrl){location.href=result.joinUrl;return}$('queueState').textContent='正在寻找另一名玩家…';action.textContent='匹配中';clearInterval(poll);poll=setInterval(async()=>{try{const state=await api('api/lobby/status');if(state.joinUrl)location.href=state.joinUrl}catch{}},1500)}catch(error){if(error.data?.activeMatch?.joinUrl){location.replace(error.data.activeMatch.joinUrl);return}toast(error.message);action.disabled=false;action.textContent=battleMode==='ai'?'创建战局':'开始匹配'}}
$('loginTab').onclick=()=>setAuthMode('login');$('registerTab').onclick=()=>setAuthMode('register');$('authForm').onsubmit=async event=>{event.preventDefault();$('authError').textContent='';try{const result=await api('api/'+authMode,{method:'POST',body:JSON.stringify({id:$('userId').value,password:$('password').value})});render(result.profile)}catch(error){$('authError').textContent=error.message}};$('logout').onclick=()=>api('api/logout',{method:'POST'}).finally(()=>location.reload());document.querySelectorAll('[data-battle-mode]').forEach(button=>button.onclick=()=>setBattleMode(button.dataset.battleMode));document.querySelectorAll('[data-team]').forEach(card=>card.onclick=()=>selectTeam(card.dataset.team));document.querySelectorAll('[data-difficulty]').forEach(button=>button.onclick=()=>setDifficulty(button.dataset.difficulty));$('autoTeam').onclick=()=>selectTeam('any');$('battleAction').onclick=beginBattle;setBattleMode('pvp');refresh();
</script></body></html>
