<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171a12" />
    <title>解放清华园 · 战区行动</title>
    <style>
      :root {
        --command-paper: #dedfca;
        --command-brass: #c0c3a5;
        --command-ink: #232c2c;
        --command-type: "Arial Narrow", "Microsoft YaHei", Arial, sans-serif;
        --command-metal:
          linear-gradient(#252c2eef, #202a2de8),
          url("../assets/field-table.png");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #1c2726;
      }
      button {
        font: inherit;
      }
      .team-lobby-card,
      .home-screen {
        visibility: hidden;
      }
      #plugin-loader {
        position: fixed;
        z-index: 999999;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(#18232144, #131e18d9),
          url("../assets/campus-command.png") center/cover;
        color: var(--command-paper);
        font-family: var(--command-type);
        transition:
          opacity 0.3s,
          visibility 0.3s;
      }
      #plugin-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #plugin-loader > div {
        display: grid;
        width: min(520px, 86vw);
        gap: 24px;
        text-align: center;
      }
      #plugin-loader .loader-eyebrow {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.13em;
        color: #ced0b6;
      }
      #plugin-loader strong {
        font: 900 clamp(38px, 7vw, 67px)/1.1 var(--command-type);
        color: #e9e7d4;
        text-shadow: 3px 4px #122019b3;
      }
      #plugin-loader small {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #ced5bf;
      }
      #plugin-loader i {
        position: relative;
        display: block;
        width: 230px;
        height: 7px;
        margin: 6px auto 0;
        background: #1c2a26;
        border: 1px solid #bcc4a17a;
        overflow: hidden;
      }
      #plugin-loader i:after {
        content: "";
        position: absolute;
        inset: 0;
        background: #d49836;
        transform-origin: left;
        animation: progress 1.4s ease-in-out infinite alternate;
      }
      @keyframes progress {
        from {
          transform: scaleX(0.15);
        }
        to {
          transform: scaleX(0.88);
        }
      }
      .loader-caption {
        position: absolute;
        bottom: 25px;
        font-size: 10px;
        color: #bbc8ad;
        letter-spacing: 0.08em;
      }
      .plugin-lifecycle {
        position: fixed;
        z-index: 1000001;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, calc(100vw - 32px));
        padding: 18px 22px 18px 60px;
        border: 1px solid #b3b79e;
        border-left: 5px solid #d09536;
        background: var(--command-metal);
        background-size: auto, 500px;
        color: #d9dfc8;
        box-shadow:
          inset 0 1px #eef0d455,
          0 9px 25px #0009;
        font: 12px/1.8 var(--command-type);
      }
      .plugin-lifecycle[hidden] {
        display: none;
      }
      .plugin-lifecycle:before {
        content: "!";
        position: absolute;
        left: 19px;
        top: 22px;
        color: #dea544;
        font-size: 28px;
        font-weight: 900;
        line-height: 1;
      }
      .plugin-lifecycle strong {
        display: block;
        color: #e1e4cf;
        margin-bottom: 6px;
        font-size: 19px;
        font-weight: 900;
        line-height: 1.2;
      }
      .plugin-lifecycle button {
        display: block;
        margin-top: 12px;
        padding: 8px 15px;
        border: 1px solid #bdc3a6;
        background: #c2c6ad;
        color: #26352a;
        cursor: pointer;
        font: 900 12px var(--command-type);
        box-shadow:
          inset 0 1px #e9ebd87a,
          0 2px #0b1a1599;
      }
      .plugin-lifecycle button:hover {
        background: #deba6b;
      }
      .plugin-toast {
        position: fixed;
        z-index: 1000001;
        top: 80px;
        left: 50%;
        max-width: min(560px, 90vw);
        transform: translate(-50%, -12px);
        padding: 12px 21px;
        border: 1px solid #b5bda2;
        border-left: 4px solid #d39839;
        background: var(--command-metal);
        background-size: auto, 400px;
        color: #e0e3c9;
        font: 700 12px/1.6 var(--command-type);
        box-shadow: 0 8px 25px #0008;
        opacity: 0;
        pointer-events: none;
        transition: 0.18s;
      }
      .plugin-toast.show {
        transform: translate(-50%, 0);
        opacity: 1;
      }
      .plugin-toast.error {
        border-color: #c78461;
        color: #ecc8ac;
      }
      .plugin-modal {
        position: fixed;
        z-index: 1000002;
        inset: 0;
        display: none;
        place-items: center;
        padding: 20px;
        background: #0a1410bb;
        font-family: var(--command-type);
      }
      .plugin-modal.show {
        display: grid;
      }
      .plugin-card {
        position: relative;
        display: grid;
        width: min(510px, 94vw);
        gap: 20px;
        padding: 35px;
        border: 2px solid #9ca791;
        background: var(--command-metal);
        background-size: auto, 500px;
        color: #d9dec7;
        box-shadow:
          inset 0 0 0 2px #1a2424,
          0 15px 65px #000c;
      }
      .plugin-card:before {
        content: "清北 · 战局指令";
        display: block;
        padding-bottom: 16px;
        border-bottom: 1px solid #7e8a7370;
        color: #949e87;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.05em;
      }
      .plugin-card small {
        display: none;
      }
      .plugin-card h2 {
        margin: 0;
        font: 900 34px/1.2 var(--command-type);
        color: #e1e4cc;
      }
      .plugin-card p {
        margin: 0;
        color: #adbba0;
        font-size: 13px;
        line-height: 1.9;
      }
      .plugin-card .actions {
        display: flex;
        justify-content: flex-end;
        gap: 14px;
        margin-top: 12px;
      }
      .plugin-card button {
        border-radius: 0;
        min-height: 44px;
        padding: 9px 19px;
        border: 1px solid #c3c7ad;
        background: linear-gradient(#d6d9c2, #aeb79e);
        color: #263328;
        font: 900 15px var(--command-type);
        cursor: pointer;
        box-shadow:
          inset 0 1px #f6f5e455,
          0 3px 5px #0b1216;
      }
      .plugin-card button:hover {
        filter: brightness(1.15);
      }
      .plugin-card button.danger {
        border-color: #b57559;
        background: linear-gradient(#a8694c, #764c3d);
        color: #ece4c8;
      }
      .plugin-card button:focus-visible,
      .plugin-lifecycle button:focus-visible {
        outline: 3px solid #daa044;
        outline-offset: 4px;
      }
      .plugin-result .result-mark {
        display: grid;
        place-items: center;
        width: 82px;
        height: 94px;
        margin: 0 auto;
        color: #e1b457;
        background: linear-gradient(#706c3cb0, #323c28b0);
        border: 2px solid #d2b464;
        font: 900 52px var(--command-type);
        clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
      }
      .plugin-result h2,
      .plugin-result p {
        text-align: center;
      }
      .plugin-result .actions {
        justify-content: center;
      }
      .plugin-result .actions button {
        min-width: 180px;
      }
      .plugin-result[data-result="loss"] .result-mark {
        color: #dca083;
        border-color: #b68b70;
        background: #623e3299;
      }
      .plugin-result[data-result="neutral"] .result-mark {
        color: #b3baa7;
        border-color: #859683;
        background: #4d584899;
      }
      @media (max-width: 520px) {
        .plugin-card {
          padding: 26px;
          gap: 17px;
        }
        .plugin-card h2 {
          font-size: 28px;
        }
        .plugin-card .actions {
          flex-wrap: wrap;
        }
        .plugin-card .actions button {
          flex: 1;
        }
        .plugin-lifecycle {
          bottom: 16px;
          padding: 15px 15px 15px 45px;
          font-size: 11px;
        }
        .plugin-lifecycle:before {
          left: 14px;
          top: 17px;
          font-size: 24px;
        }
        .plugin-lifecycle strong {
          font-size: 17px;
        }
        .plugin-toast {
          top: 70px;
        }
        .plugin-card p {
          font-size: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #plugin-loader,
        #plugin-loader i:after,
        .plugin-toast {
          animation: none;
          transition: none;
        }
      }

      /* Scope all presentation changes to this plugin-owned page. */
      body.plugin-duel-active .battle-nav {
        top: 93px;
        left: 14px;
      }
      body.plugin-duel-active .battle-nav button {
        border-radius: 0;
        background: #26322df0;
        border-color: #9ba78a85;
      }
      body.plugin-duel-active .battle-clock {
        top: 24px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        border-radius: 0;
        background: #26322df0;
        border-color: #a7b28d80;
      }
      body.plugin-duel-active .performance-hud {
        top: 94px;
      }
      body.plugin-duel-active .battle-drawer {
        top: 141px;
      }
      body.plugin-duel-active .chat-panel,
      body.plugin-duel-active .chat-entry {
        display: none !important;
      }
      #plugin-duel-ui {
        font-family: var(--command-type);
        color: #d9dfc6;
      }
      #plugin-duel-ui[hidden] {
        display: none;
      }
      .duel-player {
        position: fixed;
        top: 13px;
        width: 270px;
        min-height: 66px;
        display: flex;
        gap: 12px;
        padding: 9px 13px;
        background: var(--command-metal);
        background-size: auto, 420px;
        border: 1px solid #a5b08b8c;
        box-shadow:
          inset 0 1px #c5c9a647,
          0 4px 14px #08130c99;
        z-index: 97;
        pointer-events: none;
      }
      .duel-player.self {
        left: 14px;
      }
      .duel-player.opponent {
        right: 14px;
        flex-direction: row-reverse;
        text-align: right;
      }
      .duel-avatar {
        width: 49px;
        height: 54px;
        flex-shrink: 0;
        border: 2px solid #b4a473;
        background: linear-gradient(145deg, #863e35, #542f29);
        display: grid;
        place-items: center;
        color: #e7d6a4;
        font-size: 27px;
        font-weight: 900;
        box-shadow: inset 0 0 0 2px #ddcda755;
        overflow: hidden;
      }
      .duel-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .duel-avatar img[hidden],
      .duel-avatar span[hidden] {
        display: none;
      }
      .duel-player[data-team="thu"] .duel-avatar {
        background: linear-gradient(145deg, #626880, #334253);
      }
      .duel-player-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        gap: 2px;
      }
      .duel-player-copy small {
        color: #9bac90;
        font-size: 10px;
        line-height: 1.2;
      }
      .duel-player-copy strong {
        font-size: 17px;
        font-weight: 900;
        line-height: 1.4;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
        max-width: 188px;
        color: #e0e5cc;
      }
      .duel-player-copy > span {
        color: #8da882;
        font-size: 9px;
      }
      .duel-player[data-status="disconnected"] .duel-player-copy > span {
        color: #deac62;
      }
      .duel-player[data-status="joining"] .duel-player-copy > span {
        color: #c1bd88;
      }
      .duel-chat {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 102;
        width: 320px;
        max-width: calc(100vw - 32px);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .duel-chat-toggle {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 37px;
        padding: 8px 13px;
        border: 1px solid #9dae8280;
        border-radius: 0;
        background: #25362cf0;
        color: #cfd9be;
        font: 700 11px var(--command-type);
        box-shadow: 0 3px 11px #06160c99;
        cursor: pointer;
      }
      .duel-chat-toggle svg {
        width: 18px;
        height: 18px;
      }
      .duel-chat-toggle i {
        width: 6px;
        height: 6px;
        position: absolute;
        top: 5px;
        right: 5px;
        background: #d5a447;
        border-radius: 50%;
      }
      .duel-chat-panel {
        width: 100%;
        background:
          linear-gradient(#26352ff5, #15291ff5),
          url("../assets/field-table.png");
        border: 1px solid #9dad837d;
        box-shadow: 0 10px 30px #001e11a6;
        overflow: hidden;
      }
      .duel-chat-panel[hidden] {
        display: none;
      }
      .duel-chat-panel header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid #8d9b7244;
      }
      .duel-chat-panel header strong {
        font-size: 12px;
        color: #d6ddc2;
      }
      .duel-chat-panel header > span {
        font-size: 9px;
        color: #8fa581;
      }
      .duel-chat-panel header button {
        margin-left: auto;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        color: #b0c39f;
        font-size: 19px;
        padding: 0 2px;
        cursor: pointer;
      }
      .duel-chat-log {
        height: 180px;
        overflow-y: auto;
        padding: 10px 12px;
        scrollbar-width: thin;
        scrollbar-color: #8a9f73 #122a1c;
      }
      .duel-chat-empty {
        font-size: 11px;
        color: #7e9970;
        margin: 8px 0;
      }
      .duel-chat-log .duel-message {
        margin: 0 0 10px;
        font-size: 11px;
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .duel-message b {
        font-weight: 700;
        color: #d3927c;
        margin-right: 4px;
      }
      .duel-message.thu b {
        color: #a7b6db;
      }
      .duel-message > span {
        color: #ced8be;
        white-space: pre-wrap;
      }
      .duel-chat-panel form {
        display: flex;
        gap: 8px;
        padding: 9px;
        border-top: 1px solid #8d9b7244;
      }
      .duel-chat-panel input {
        flex: 1;
        min-width: 0;
        border: 1px solid #8aa77366;
        border-radius: 0;
        background: #13291ed9;
        padding: 9px;
        color: #d9e1c8;
        font: 11px var(--command-type);
      }
      .duel-chat-panel input::placeholder {
        color: #78946a;
      }
      .duel-chat-panel form button {
        border: 1px solid #a8b48c;
        border-radius: 0;
        background: #b0bc93;
        color: #1c3323;
        padding: 8px 12px;
        font: 900 11px var(--command-type);
        box-shadow: 0 2px #081b1299;
        cursor: pointer;
      }
      .duel-chat-panel form button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .duel-chat button:hover:not(:disabled) {
        filter: brightness(1.15);
      }
      .duel-chat button:focus-visible,
      .duel-chat input:focus-visible {
        outline: 2px solid #dfab50;
        outline-offset: 3px;
      }
      @media (max-width: 760px) {
        .duel-player {
          width: 220px;
          padding: 9px;
          gap: 9px;
        }
        .duel-player-copy strong {
          max-width: 155px;
          font-size: 15px;
        }
        .duel-avatar {
          width: 43px;
          height: 47px;
          font-size: 23px;
        }
        body.plugin-duel-active .battle-clock {
          top: 88px;
          right: 14px;
          left: auto;
          transform: none;
          padding: 7px 9px;
          font-size: 11px;
        }
        body.plugin-duel-active .performance-hud {
          top: 130px;
        }
        body.plugin-duel-active .battle-nav {
          top: 89px;
        }
        body.plugin-duel-active .battle-nav button {
          width: 33px;
          height: 33px;
          font-size: 19px;
        }
        .duel-chat-log {
          height: 160px;
        }
      }
      @media (max-width: 500px) {
        .duel-player {
          width: calc(50vw - 18px);
          top: 10px;
          min-height: 63px;
          padding: 8px 7px;
          gap: 7px;
        }
        .duel-player.self {
          left: 10px;
        }
        .duel-player.opponent {
          right: 10px;
        }
        .duel-avatar {
          width: 33px;
          height: 40px;
          font-size: 20px;
        }
        .duel-player-copy {
          gap: 3px;
          flex: 1;
        }
        .duel-player-copy strong {
          font-size: 12px;
          max-width: 100%;
        }
        .duel-player-copy small {
          font-size: 8px;
          white-space: nowrap;
        }
        .duel-player-copy > span {
          font-size: 8px;
          line-height: 1.2;
        }
        body.plugin-duel-active .battle-nav {
          top: 84px;
          left: 10px;
          gap: 4px;
        }
        body.plugin-duel-active .battle-nav button {
          width: 29px;
          height: 29px;
          font-size: 17px;
        }
        body.plugin-duel-active .battle-clock {
          top: 83px;
          right: 10px;
          font-size: 10px;
          padding: 7px 6px;
        }
        body.plugin-duel-active .battle-drawer {
          top: 120px;
        }
        .duel-chat {
          right: 10px;
          bottom: 12px;
          max-width: calc(100vw - 20px);
          width: 300px;
        }
        .duel-chat-log {
          height: 145px;
        }
        .duel-chat-toggle {
          min-height: 34px;
          font-size: 10px;
          padding: 7px 10px;
        }
      }

      /* One fitted vector per control; do not inherit the original CSS glyph boxes. */
      body.plugin-duel-active
        .battle-nav
        button[aria-label="打开决策树"]
        .focus-tree-glyph,
      body.plugin-duel-active
        .battle-nav
        button[aria-label="打开研发"]
        .research-nav-icon {
        display: none !important;
      }
      body.plugin-duel-active
        .battle-nav
        button[aria-label="打开决策树"]::before,
      body.plugin-duel-active
        .battle-nav
        button[aria-label="打开研发"]::before {
        content: "";
        display: block;
        width: 23px;
        height: 23px;
        position: static;
        transform: none;
        border: 0;
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        pointer-events: none;
      }
      body.plugin-duel-active
        .battle-nav
        button[aria-label="打开决策树"]::before {
        background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23e4d8a5%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%229%22%20y%3D%222%22%20width%3D%226%22%20height%3D%225%22%20rx%3D%221%22%2F%3E%3Cpath%20d%3D%22M12%207v5M5%2017v-5h14v5%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%2217%22%20width%3D%226%22%20height%3D%225%22%20rx%3D%221%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2217%22%20width%3D%226%22%20height%3D%225%22%20rx%3D%221%22%2F%3E%3C%2Fsvg%3E");
      }
      body.plugin-duel-active
        .battle-nav
        button[aria-label="打开研发"]::before {
        background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23e4d8a5%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M9%203h6M10%203v7l-5.7%209a2%202%200%200%200%201.7%203h12a2%202%200%200%200%201.7-3L14%2010V3M7.6%2015h8.8%22%2F%3E%3Cpath%20d%3D%22M10%2018h.01M14%2019h.01%22%2F%3E%3C%2Fsvg%3E");
      }
      @media (max-width: 500px) {
        body.plugin-duel-active
          .battle-nav
          button[aria-label="打开决策树"]::before,
        body.plugin-duel-active
          .battle-nav
          button[aria-label="打开研发"]::before {
          width: 20px;
          height: 20px;
        }
      }
      html[data-duel-paused="true"] .network-sync-warning { display: none; }
      html[data-duel-paused="true"] .webgl-stage { pointer-events: none; }
      .plugin-lifecycle button[hidden] { display: none; }
      .result-progression { margin: 24px 0; padding: 18px; border: 1px solid #9e8d55; background: #18231f; text-align: left; }
      .result-progression[hidden] { display: none; }
      .progression-heading, .progression-caption { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
      .progression-heading strong { font: 700 28px Georgia, serif; color: #efe6c5; }
      .progression-heading span { color: #dcc77e; font-weight: 700; }
      .progression-track { height: 15px; margin: 16px 0 10px; padding: 2px; border: 1px solid #8b805c; background: #080f0d; overflow: hidden; }
      .progression-track i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, transparent 0 29px, #19241e55 29px 31px), linear-gradient(90deg,#8d7843,#e7d38e); box-shadow: 0 0 14px #dbc68044; }
      .progression-caption { color: #b9bba5; font-size: 12px; }
      .progression-caption strong { color: #e5d18c; }
    </style>
  </head>
  <body>
    <div id="plugin-loader" role="status">
      <div>
        <span class="loader-eyebrow">THE CAMPUS CAMPAIGN · 2026</span
        ><strong>战区行动</strong
        ><small id="plugin-loader-status">正在验证账号与战局</small
        ><i aria-hidden="true"></i>
      </div>
      <span class="loader-caption">北京 · 海淀 / 两园之间，战局由你。</span>
    </div>
    <div id="root"></div>
    <div id="plugin-duel-ui" hidden>
      <section class="duel-player self" id="duel-self" aria-label="自己">
        <div class="duel-avatar" id="duel-self-avatar">
          <img alt="" hidden /><span aria-hidden="true">北</span>
        </div>
        <div class="duel-player-copy">
          <small id="duel-self-team">自己</small
          ><strong id="duel-self-name">正在连接</strong
          ><span id="duel-self-status">正在入场</span>
        </div>
      </section>
      <section
        class="duel-player opponent"
        id="duel-opponent"
        aria-label="对手"
      >
        <div class="duel-avatar" id="duel-opponent-avatar">
          <img alt="" hidden /><span aria-hidden="true">清</span>
        </div>
        <div class="duel-player-copy">
          <small id="duel-opponent-team">对手</small
          ><strong id="duel-opponent-name">正在连接</strong
          ><span id="duel-opponent-status">正在入场</span>
        </div>
      </section>
      <div class="duel-chat">
        <section
          id="duel-chat-panel"
          class="duel-chat-panel"
          aria-label="全局聊天"
          hidden
        >
          <header>
            <strong>全局聊天</strong><span>仅本场对局可见</span
            ><button
              id="duel-chat-close"
              aria-label="收起全局聊天"
              type="button"
            >
              ×
            </button>
          </header>
          <div
            class="duel-chat-log"
            id="duel-chat-log"
            role="log"
            aria-live="polite"
            aria-relevant="additions text"
          >
            <p class="duel-chat-empty">向对手打个招呼。</p>
          </div>
          <form id="duel-chat-form">
            <input
              id="duel-chat-input"
              aria-label="全局聊天消息"
              maxlength="200"
              autocomplete="off"
              placeholder="发送给对手…"
            /><button id="duel-chat-send" type="submit" disabled>发送</button>
          </form>
        </section>
        <button
          id="duel-chat-toggle"
          class="duel-chat-toggle"
          type="button"
          aria-label="全局聊天"
          aria-expanded="false"
          aria-controls="duel-chat-panel"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="M3 4h18v13H9l-5 4v-4H3Z" />
            <path d="M7 8h10M7 12h7" /></svg
          ><span>全局聊天</span><i id="duel-chat-unread" hidden></i>
        </button>
      </div>
    </div>
    <aside class="plugin-toast" id="plugin-toast" role="status"></aside>
    <aside
      class="plugin-lifecycle"
      id="lifecycle-notice"
      role="status"
      aria-live="polite"
      hidden
    >
      <strong id="lifecycle-title"></strong><span id="lifecycle-body"></span
      ><button id="lifecycle-reload" hidden>重新加载并连接</button>
    </aside>
    <div
      class="plugin-modal"
      id="surrender-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="surrender-title"
    >
      <section class="plugin-card">
        <small>战局操作</small>
        <h2 id="surrender-title">确认投降？</h2>
        <p>投降会判定对方获胜，按实际击杀与占点结算。零战绩不获得经验或校币。关闭窗口有60秒返回宽限。</p>
        <div class="actions">
          <button id="continue-battle">继续战斗</button
          ><button class="danger" id="confirm-surrender">确认投降</button>
        </div>
      </section>
    </div>
    <div
      class="plugin-modal plugin-result"
      id="result-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="result-title"
    >
      <section class="plugin-card">
        <div class="result-mark" id="result-mark">胜</div>
        <h2 id="result-title">战局结束</h2>
        <p id="result-detail"></p>
        <p id="result-reward"></p>
        <section id="result-progression" class="result-progression" hidden aria-label="阵营生涯经验">
          <div class="progression-heading"><strong data-level></strong><span data-earned></span></div>
          <div class="progression-track" role="progressbar" aria-label="等级进度" aria-valuemin="0"><i data-fill></i></div>
          <div class="progression-caption"><span data-value></span><strong data-status role="status"></strong></div>
        </section>
        <div class="actions"><button id="return-lobby">返回指挥部</button></div>
      </section>
    </div>
    <script src="../protocol.js"></script>
    <script src="../lifecycle-client.js"></script>
    <script src="../duel-ui.js"></script>
    <script src="../performance-ui.js"></script>
    <script src="../result-progression.js"></script>
    <script>
      (() => {
        const params = new URLSearchParams(location.search),
          room = (params.get("join") || "")
            .replace(/[^a-z0-9]/gi, "")
            .toUpperCase(),
          team = params.get("pluginTeam"),
          pluginBase = location.pathname.replace(/\/play\/$/, ""),
          connectionId = Array.from(
            crypto.getRandomValues(new Uint32Array(4)),
            (n) => n.toString(16),
          ).join("-");
        let profile = null,
          activeMatch = null,
          entered = false,
          completed = false,
          autoJoined = false,
          toastTimer = 0,
          presence = null;
        const $ = (id) => document.getElementById(id),
          api = async (path, options = {}) => {
            const response = await fetch(pluginBase + path, {
              credentials: "same-origin",
              headers: {
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
              ...options,
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "请求失败");
            return data;
          };
        const toast = (text, error = false) => {
          const node = $("plugin-toast");
          node.textContent = text;
          node.classList.toggle("error", error);
          node.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => node.classList.remove("show"), 2600);
        };
        const setReactInput = (input, value) => {
          const setter = Object.getOwnPropertyDescriptor(
            HTMLInputElement.prototype,
            "value",
          )?.set;
          setter?.call(input, value);
          input.dispatchEvent(new Event("input", { bubbles: true }));
          input.dispatchEvent(new Event("change", { bubbles: true }));
        };
        let duelUI = null;
        let gameConnected = false,
          serverPaused = false,
          lastGameStateAt = 0,
          lifecycleState = null,
          lifecycleReceivedAt = 0,
          lifecycleFault = "",
          lastLifecycleAt = Date.now();
        const renderLifecycle = () => {
          const paused = serverPaused && gameConnected && Date.now() - lastGameStateAt < 6000 && !completed;
          document.documentElement.dataset.duelPaused = String(paused);
          const panel = $("lifecycle-notice");
          if (completed) {
            panel.hidden = true;
            return;
          }
          const serverNow =
            (lifecycleState?.serverTime || Date.now()) +
            (Date.now() - lifecycleReceivedAt);
          const fault =
            lifecycleFault ||
            (Date.now() - lastLifecycleAt > 20000
              ? "超过20秒未收到对局生命周期更新，正在等待服务器恢复。"
              : "");
          let message = fault
            ? { title: "服务器连接异常", body: fault }
            : QingbeiLifecycle.message(lifecycleState, serverNow);
          if (paused && !fault) message = {title:"等待玩家 · 对局暂停",body:(message?.body || "正在等待双方完成入场或重连。") + " 双方就绪后自动继续。"};
          panel.hidden = !message;
          if (!message) return;
          $("lifecycle-title").textContent = message.title;
          $("lifecycle-body").textContent = message.body;
          $("lifecycle-reload").hidden = !(
            fault ||
            lifecycleState?.participants?.some(
              (p) => p.self && p.status === "disconnected",
            )
          );
        };
        const updateLifecycle = (state) => {
          const old = lifecycleState;
          lastLifecycleAt = Date.now();
          lifecycleFault = "";
          lifecycleState = state;
          duelUI?.state(state);
          lifecycleReceivedAt = Date.now();
          for (const peer of state.participants || []) {
            if (
              !peer.self &&
              peer.status === "online" &&
              old?.participants?.some(
                (p) => p.id === peer.id && p.status === "disconnected",
              )
            )
              toast(`对手 ${peer.id} 已重新连接`);
          }
          if (state.completed) showResult(state);
          renderLifecycle();
        };
        const lifecycleTimer = setInterval(renderLifecycle, 1000);
        $("lifecycle-reload").onclick = () => location.reload();
        const heartbeat = async () => {
          if (completed || !room || (entered && !gameConnected)) return;
          try {
            const state = await api("/api/match/heartbeat", {
              method: "POST",
              body: JSON.stringify({ roomCode: room, connectionId }),
            });
            updateLifecycle(state);
          } catch (error) {
            lifecycleFault = error.message;
            renderLifecycle();
          }
        };
        const showResult = (state) => {
          if (completed) return;
          completed = true;
          duelUI?.finish();
          clearInterval(lifecycleTimer);
          $("lifecycle-notice").hidden = true;
          presence?.close();
          $("plugin-loader").classList.add("hidden");
          $("surrender-modal").classList.remove("show");
          const won = state.winner === team;
          $("result-modal").dataset.result = state.winner
            ? won
              ? "win"
              : "loss"
            : "neutral";
          $("result-mark").textContent = state.winner
            ? won
              ? "胜"
              : "负"
            : "—";
          $("result-title").textContent = state.winner
            ? won
              ? "战斗胜利"
              : "战斗结束"
            : "战局中断";
          $("result-detail").textContent =
            (state.reason || "战局已结算") +
            (state.winner ? "；经验已经计入个人主页。" : "");
          $("result-modal").classList.add("show");
          const reward = state.reward;
          window.QingbeiResultProgression.show($("result-progression"), reward?.progression, {
            animate: won, reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
          });
          $("result-reward").textContent = state.winner && reward
            ? `击杀 ${reward.kills} · 占点 ${reward.captures} · 胜利加成 ${reward.victoryBonus}，按 ${Math.round(reward.multiplier * 100)}% 结算：+${reward.experience} EXP · +${reward.coins} 校币`
            : "";
        };
        const reportGameDisconnect = async () => {
          gameConnected = false;
          duelUI?.connected(false);
          if (completed) return;
          try {
            updateLifecycle(
              await api("/api/match/disconnect", {
                method: "POST",
                body: JSON.stringify({ roomCode: room, connectionId }),
              }),
            );
          } catch {
            lifecycleFault =
              "游戏连接已中断且无法联系服务器，请重新加载检查连接。";
            renderLifecycle();
          }
        };
        const markDisconnected = () => {
          if (completed || !room) return;
          presence?.close();
          const body = JSON.stringify({ roomCode: room, connectionId });
          if (navigator.sendBeacon)
            navigator.sendBeacon(
              pluginBase + "/api/match/disconnect",
              new Blob([body], { type: "application/json" }),
            );
          else
            fetch(pluginBase + "/api/match/disconnect", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body,
              credentials: "same-origin",
              keepalive: true,
            }).catch(() => {});
        };
        addEventListener("pagehide", markDisconnected);
        $("continue-battle").onclick = () =>
          $("surrender-modal").classList.remove("show");
        $("confirm-surrender").onclick = async () => {
          try {
            const state = await api("/api/match/surrender", {
              method: "POST",
              body: JSON.stringify({ roomCode: room }),
            });
            showResult(state);
          } catch (error) {
            toast(error.message, true);
          }
        };
        $("return-lobby").onclick = () => location.replace(pluginBase + "/");

        const NativeWebSocket = window.WebSocket;
        const commandStatus=(message)=>{
          const event=new CustomEvent('qingbei-command-status',{detail:{message},cancelable:true});
          window.dispatchEvent(event);
          if(!event.defaultPrevented){const notice=document.querySelector('.command-notice');if(notice)notice.textContent=message;}
        };
        const performanceUI=QingbeiPerformance.mount({room});
        class PluginWebSocket extends NativeWebSocket {
          constructor(url, protocols) {
            super(url, protocols);
            this.bridge = QingbeiProtocol.createBridge({
              team,
              send: (raw) => NativeWebSocket.prototype.send.call(this, raw),
              notify: (message,error)=>{toast(message,error);commandStatus(message);},
              status: commandStatus,
            });
            performanceUI.attach(this.bridge,this);
            this.addEventListener("open", () => {
              gameConnected = true;
              duelUI?.connected(true);
              void heartbeat();
            });
            this.addEventListener("message", (event) => {
              if (typeof event.data === "string") {
                let decoded=null;
                try {
                  const wire = JSON.parse(event.data);
                  if (wire.type === "relay") {
                    const payload = JSON.parse(wire.data);
                    decoded=payload;
                    if (payload.type === "state" || payload.type === "state_delta") {
                      const pauseChanged = serverPaused !== !!payload.pausedForPlayers;
                      serverPaused = !!payload.pausedForPlayers;
                      lastGameStateAt = Date.now();
                      if (pauseChanged) renderLifecycle();
                    }
                  }
                } catch {}
                this.bridge.incoming(event.data,decoded);
                duelUI?.incoming(event.data,decoded);
              }
            });
            this.addEventListener("close", () => {
              if (!completed) void reportGameDisconnect();
            });
          }
          send(data) {
            if (completed) return;
            if (serverPaused) {
              try {
                const wire = JSON.parse(data), payload = wire.type === "relay" ? JSON.parse(wire.data) : null;
                if (payload && ["client_commands","client_action","decision_vote_request","decision_vote_cast"].includes(payload.type)) {
                  toast("正在等待玩家入场或重连，双方就绪后可继续操作"); return;
                }
              } catch {}
            }
            return this.bridge.outgoing(
              duelUI ? duelUI.outgoing(data, this) : data,
            );
          }
        }
        window.WebSocket = PluginWebSocket;

        const scanGameUI = () => {
          const stage = document.querySelector(
            ".webgl-stage canvas,.battle-nav",
          );
          if (stage) {
            entered = true;
            duelUI?.show();
            $("plugin-loader").classList.add("hidden");
          }
          const lobby = document.querySelector(".team-lobby-card");
          if (lobby && !autoJoined) {
            const input = lobby.querySelector("input");
            if (input && profile?.id && input.value !== profile.id)
              setReactInput(input, profile.id);
            const label = team === "thu" ? "清华大学" : "北京大学",
              button = [...lobby.querySelectorAll("button")].find((item) =>
                item.textContent.includes(label),
              );
            if (button && !button.disabled) {
              autoJoined = true;
              setTimeout(() => button.click(), 80);
            }
          }
          for (const button of document.querySelectorAll("button")) {
            const text = button.textContent.trim();
            if (text === "保存并退出" || text === "退出并保存") {
              button.textContent = "投降";
              button.dataset.pluginSurrender = "1";
              button.classList.add("danger");
            }
            if (button.title === "返回主页面") {
              button.title = "战局菜单";
              button.setAttribute("aria-label", "战局菜单");
            }
          }
          if (
            entered &&
            document.querySelector(".home-screen") &&
            !document.querySelector(".webgl-stage")
          )
            location.reload();
        };
        document.addEventListener(
          "click",
          (event) => {
            const button = event.target.closest?.("button");
            if (
              button?.closest(".focus-tree-footer") &&
              button.textContent.includes("取消当前决策")
            ) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              duelUI?.cancelDecision();
              return;
            }
            if (!button || button.dataset.pluginSurrender !== "1") return;
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            $("surrender-modal").classList.add("show");
          },
          true,
        );
        new MutationObserver(scanGameUI).observe(document.documentElement, {
          childList: true,
          subtree: true,
          characterData: true,
        });

        const loadGame = async () => {
          const base = "https://very12345.github.io/qingbei-webgl-campaign/";
          $("plugin-loader-status").textContent = "正在展开校园战场";
          const response = await fetch(base + "index.html", {
            cache: "no-store",
          });
          if (!response.ok) throw new Error("游戏资源返回 " + response.status);
          const remote = new DOMParser().parseFromString(
            await response.text(),
            "text/html",
          );
          for (const source of remote.querySelectorAll(
            'link[rel="stylesheet"],link[rel="modulepreload"]',
          )) {
            const link = document.createElement("link");
            for (const attribute of source.attributes)
              link.setAttribute(attribute.name, attribute.value);
            link.href = new URL(source.getAttribute("href"), base).href;
            document.head.appendChild(link);
          }
          const source = remote.querySelector('script[type="module"][src]');
          if (!source) throw new Error("没有找到游戏入口");
          const script = document.createElement("script");
          script.type = "module";
          script.crossOrigin = "anonymous";
          script.src = new URL(source.getAttribute("src"), base).href;
          script.onerror = () => {
            $("plugin-loader-status").textContent =
              "游戏代码加载失败，请刷新重试";
          };
          document.head.appendChild(script);
        };
        (async () => {
          try {
            if (!room || (team !== "pku" && team !== "thu"))
              throw new Error("战局链接无效");
            const result = await api("/api/me");
            profile = result.profile;
            activeMatch = profile.activeMatch;
            if (!activeMatch?.joinUrl) {
              location.replace(pluginBase + "/");
              return;
            }
            if (activeMatch.roomCode !== room || activeMatch.team !== team) {
              location.replace(activeMatch.joinUrl);
              return;
            }
            duelUI = QingbeiDuel.mount({
              root: $("plugin-duel-ui"),
              team,
              profile,
              pluginBase,
              notify: toast,
            });
            duelUI.state(activeMatch);
            sessionStorage.setItem("qingbei-player-name", profile.id);
            presence = new EventSource(
              pluginBase +
                "/api/match/presence?room=" +
                encodeURIComponent(room) +
                "&connectionId=" +
                encodeURIComponent(connectionId),
            );
            presence.onmessage = (event) => {
              updateLifecycle(JSON.parse(event.data));
              if (!completed) void heartbeat();
            };
            presence.onerror = () => {
              if (!completed) {
                lifecycleFault =
                  "对局服务暂时不可达，正在重新连接；断线超过60秒可能判负。";
                renderLifecycle();
              }
            };
            presence.addEventListener("replaced", () => {
              completed = true;
              duelUI?.finish();
              presence.close();
              $("plugin-loader").classList.add("hidden");
              $("result-mark").textContent = "↗";
              $("result-title").textContent = "已在另一个页面继续";
              $("result-detail").textContent =
                "请在新页面操作，本页面不再发送命令。";
              $("result-modal").classList.add("show");
            });
            await loadGame();
            setTimeout(scanGameUI, 100);
          } catch (error) {
            $("plugin-loader-status").textContent = error.message;
            setTimeout(() => location.replace(pluginBase + "/"), 1800);
          }
        })();
      })();
    </script>
  </body>
</html>
