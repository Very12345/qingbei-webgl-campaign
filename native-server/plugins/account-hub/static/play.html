<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171a12" />
    <title>解放清华园 · 战区行动</title>
    <style>
      :root {
        --command-paper: #dedfca;
        --command-brass: #c0c3a5;
        --command-ink: #232c2c;
        --command-type: "Arial Narrow", "Microsoft YaHei", Arial, sans-serif;
        --command-metal:
          linear-gradient(#252c2eef, #202a2de8),
          url("../assets/field-table.png");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #1c2726;
      }
      button {
        font: inherit;
      }
      .team-lobby-card,
      .home-screen {
        visibility: hidden;
      }
      #plugin-loader {
        position: fixed;
        z-index: 999999;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(#18232144, #131e18d9),
          url("../assets/campus-command.png") center/cover;
        color: var(--command-paper);
        font-family: var(--command-type);
        transition:
          opacity 0.3s,
          visibility 0.3s;
      }
      #plugin-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #plugin-loader > div {
        display: grid;
        width: min(520px, 86vw);
        gap: 24px;
        text-align: center;
      }
      #plugin-loader .loader-eyebrow {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.13em;
        color: #ced0b6;
      }
      #plugin-loader strong {
        font: 900 clamp(38px, 7vw, 67px)/1.1 var(--command-type);
        color: #e9e7d4;
        text-shadow: 3px 4px #122019b3;
      }
      #plugin-loader small {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #ced5bf;
      }
      #plugin-loader i {
        position: relative;
        display: block;
        width: 230px;
        height: 7px;
        margin: 6px auto 0;
        background: #1c2a26;
        border: 1px solid #bcc4a17a;
        overflow: hidden;
      }
      #plugin-loader i:after {
        content: "";
        position: absolute;
        inset: 0;
        background: #d49836;
        transform-origin: left;
        animation: progress 1.4s ease-in-out infinite alternate;
      }
      @keyframes progress {
        from {
          transform: scaleX(0.15);
        }
        to {
          transform: scaleX(0.88);
        }
      }
      .loader-caption {
        position: absolute;
        bottom: 25px;
        font-size: 10px;
        color: #bbc8ad;
        letter-spacing: 0.08em;
      }
      .plugin-lifecycle {
        position: fixed;
        z-index: 1000001;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, calc(100vw - 32px));
        padding: 18px 22px 18px 60px;
        border: 1px solid #b3b79e;
        border-left: 5px solid #d09536;
        background: var(--command-metal);
        background-size: auto, 500px;
        color: #d9dfc8;
        box-shadow:
          inset 0 1px #eef0d455,
          0 9px 25px #0009;
        font: 12px/1.8 var(--command-type);
      }
      .plugin-lifecycle[hidden] {
        display: none;
      }
      .plugin-lifecycle:before {
        content: "!";
        position: absolute;
        left: 19px;
        top: 22px;
        color: #dea544;
        font-size: 28px;
        font-weight: 900;
        line-height: 1;
      }
      .plugin-lifecycle strong {
        display: block;
        color: #e1e4cf;
        margin-bottom: 6px;
        font-size: 19px;
        font-weight: 900;
        line-height: 1.2;
      }
      .plugin-lifecycle button {
        display: block;
        margin-top: 12px;
        padding: 8px 15px;
        border: 1px solid #bdc3a6;
        background: #c2c6ad;
        color: #26352a;
        cursor: pointer;
        font: 900 12px var(--command-type);
        box-shadow:
          inset 0 1px #e9ebd87a,
          0 2px #0b1a1599;
      }
      .plugin-lifecycle button:hover {
        background: #deba6b;
      }
      .plugin-toast {
        position: fixed;
        z-index: 1000001;
        top: 80px;
        left: 50%;
        max-width: min(560px, 90vw);
        transform: translate(-50%, -12px);
        padding: 12px 21px;
        border: 1px solid #b5bda2;
        border-left: 4px solid #d39839;
        background: var(--command-metal);
        background-size: auto, 400px;
        color: #e0e3c9;
        font: 700 12px/1.6 var(--command-type);
        box-shadow: 0 8px 25px #0008;
        opacity: 0;
        pointer-events: none;
        transition: 0.18s;
      }
      .plugin-toast.show {
        transform: translate(-50%, 0);
        opacity: 1;
      }
      .plugin-toast.error {
        border-color: #c78461;
        color: #ecc8ac;
      }
      .plugin-modal {
        position: fixed;
        z-index: 1000002;
        inset: 0;
        display: none;
        place-items: center;
        padding: 20px;
        background: #0a1410bb;
        font-family: var(--command-type);
      }
      .plugin-modal.show {
        display: grid;
      }
      .plugin-card {
        position: relative;
        display: grid;
        width: min(510px, 94vw);
        gap: 20px;
        padding: 35px;
        border: 2px solid #9ca791;
        background: var(--command-metal);
        background-size: auto, 500px;
        color: #d9dec7;
        box-shadow:
          inset 0 0 0 2px #1a2424,
          0 15px 65px #000c;
      }
      .plugin-card:before {
        content: "清北 · 战局指令";
        display: block;
        padding-bottom: 16px;
        border-bottom: 1px solid #7e8a7370;
        color: #949e87;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.05em;
      }
      .plugin-card small {
        display: none;
      }
      .plugin-card h2 {
        margin: 0;
        font: 900 34px/1.2 var(--command-type);
        color: #e1e4cc;
      }
      .plugin-card p {
        margin: 0;
        color: #adbba0;
        font-size: 13px;
        line-height: 1.9;
      }
      .plugin-card .actions {
        display: flex;
        justify-content: flex-end;
        gap: 14px;
        margin-top: 12px;
      }
      .plugin-card button {
        border-radius: 0;
        min-height: 44px;
        padding: 9px 19px;
        border: 1px solid #c3c7ad;
        background: linear-gradient(#d6d9c2, #aeb79e);
        color: #263328;
        font: 900 15px var(--command-type);
        cursor: pointer;
        box-shadow:
          inset 0 1px #f6f5e455,
          0 3px 5px #0b1216;
      }
      .plugin-card button:hover {
        filter: brightness(1.15);
      }
      .plugin-card button.danger {
        border-color: #b57559;
        background: linear-gradient(#a8694c, #764c3d);
        color: #ece4c8;
      }
      .plugin-card button:focus-visible,
      .plugin-lifecycle button:focus-visible {
        outline: 3px solid #daa044;
        outline-offset: 4px;
      }
      .plugin-result .result-mark {
        display: grid;
        place-items: center;
        width: 82px;
        height: 94px;
        margin: 0 auto;
        color: #e1b457;
        background: linear-gradient(#706c3cb0, #323c28b0);
        border: 2px solid #d2b464;
        font: 900 52px var(--command-type);
        clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
      }
      .plugin-result h2,
      .plugin-result p {
        text-align: center;
      }
      .plugin-result .actions {
        justify-content: center;
      }
      .plugin-result .actions button {
        min-width: 180px;
      }
      .plugin-result[data-result="loss"] .result-mark {
        color: #dca083;
        border-color: #b68b70;
        background: #623e3299;
      }
      .plugin-result[data-result="neutral"] .result-mark {
        color: #b3baa7;
        border-color: #859683;
        background: #4d584899;
      }
      @media (max-width: 520px) {
        .plugin-card {
          padding: 26px;
          gap: 17px;
        }
        .plugin-card h2 {
          font-size: 28px;
        }
        .plugin-card .actions {
          flex-wrap: wrap;
        }
        .plugin-card .actions button {
          flex: 1;
        }
        .plugin-lifecycle {
          bottom: 16px;
          padding: 15px 15px 15px 45px;
          font-size: 11px;
        }
        .plugin-lifecycle:before {
          left: 14px;
          top: 17px;
          font-size: 24px;
        }
        .plugin-lifecycle strong {
          font-size: 17px;
        }
        .plugin-toast {
          top: 70px;
        }
        .plugin-card p {
          font-size: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #plugin-loader,
        #plugin-loader i:after,
        .plugin-toast {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="plugin-loader" role="status">
      <div>
        <span class="loader-eyebrow">THE CAMPUS CAMPAIGN · 2026</span
        ><strong>战区行动</strong
        ><small id="plugin-loader-status">正在验证账号与战局</small
        ><i aria-hidden="true"></i>
      </div>
      <span class="loader-caption">北京 · 海淀 / 两园之间，战局由你。</span>
    </div>
    <div id="root"></div>
    <aside class="plugin-toast" id="plugin-toast" role="status"></aside>
    <aside
      class="plugin-lifecycle"
      id="lifecycle-notice"
      role="status"
      aria-live="polite"
      hidden
    >
      <strong id="lifecycle-title"></strong><span id="lifecycle-body"></span
      ><button id="lifecycle-reload" hidden>重新加载并连接</button>
    </aside>
    <div
      class="plugin-modal"
      id="surrender-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="surrender-title"
    >
      <section class="plugin-card">
        <small>战局操作</small>
        <h2 id="surrender-title">确认投降？</h2>
        <p>投降会立即判定对方获胜并结算经验。关闭窗口则有60秒返回宽限。</p>
        <div class="actions">
          <button id="continue-battle">继续战斗</button
          ><button class="danger" id="confirm-surrender">确认投降</button>
        </div>
      </section>
    </div>
    <div
      class="plugin-modal plugin-result"
      id="result-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="result-title"
    >
      <section class="plugin-card">
        <div class="result-mark" id="result-mark">胜</div>
        <h2 id="result-title">战局结束</h2>
        <p id="result-detail"></p>
        <div class="actions"><button id="return-lobby">返回指挥部</button></div>
      </section>
    </div>
    <script src="../protocol.js"></script>
    <script src="../lifecycle-client.js"></script>
    <script>
      (() => {
        const params = new URLSearchParams(location.search),
          room = (params.get("join") || "")
            .replace(/[^a-z0-9]/gi, "")
            .toUpperCase(),
          team = params.get("pluginTeam"),
          pluginBase = location.pathname.replace(/\/play\/$/, ""),
          connectionId = Array.from(
            crypto.getRandomValues(new Uint32Array(4)),
            (n) => n.toString(16),
          ).join("-");
        let profile = null,
          activeMatch = null,
          entered = false,
          completed = false,
          autoJoined = false,
          toastTimer = 0,
          presence = null;
        const $ = (id) => document.getElementById(id),
          api = async (path, options = {}) => {
            const response = await fetch(pluginBase + path, {
              credentials: "same-origin",
              headers: {
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
              ...options,
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "请求失败");
            return data;
          };
        const toast = (text, error = false) => {
          const node = $("plugin-toast");
          node.textContent = text;
          node.classList.toggle("error", error);
          node.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => node.classList.remove("show"), 2600);
        };
        const setReactInput = (input, value) => {
          const setter = Object.getOwnPropertyDescriptor(
            HTMLInputElement.prototype,
            "value",
          )?.set;
          setter?.call(input, value);
          input.dispatchEvent(new Event("input", { bubbles: true }));
          input.dispatchEvent(new Event("change", { bubbles: true }));
        };
        let gameConnected = false,
          lifecycleState = null,
          lifecycleReceivedAt = 0,
          lifecycleFault = "",
          lastLifecycleAt = Date.now();
        const renderLifecycle = () => {
          const panel = $("lifecycle-notice");
          if (completed) {
            panel.hidden = true;
            return;
          }
          const serverNow =
            (lifecycleState?.serverTime || Date.now()) +
            (Date.now() - lifecycleReceivedAt);
          const fault =
            lifecycleFault ||
            (Date.now() - lastLifecycleAt > 20000
              ? "超过20秒未收到对局生命周期更新，正在等待服务器恢复。"
              : "");
          const message = fault
            ? { title: "服务器连接异常", body: fault }
            : QingbeiLifecycle.message(lifecycleState, serverNow);
          panel.hidden = !message;
          if (!message) return;
          $("lifecycle-title").textContent = message.title;
          $("lifecycle-body").textContent = message.body;
          $("lifecycle-reload").hidden = !(
            fault ||
            lifecycleState?.participants?.some(
              (p) => p.self && p.status === "disconnected",
            )
          );
        };
        const updateLifecycle = (state) => {
          const old = lifecycleState;
          lastLifecycleAt = Date.now();
          lifecycleFault = "";
          lifecycleState = state;
          lifecycleReceivedAt = Date.now();
          for (const peer of state.participants || []) {
            if (
              !peer.self &&
              peer.status === "online" &&
              old?.participants?.some(
                (p) => p.id === peer.id && p.status === "disconnected",
              )
            )
              toast(`对手 ${peer.id} 已重新连接`);
          }
          if (state.completed) showResult(state);
          renderLifecycle();
        };
        const lifecycleTimer = setInterval(renderLifecycle, 1000);
        $("lifecycle-reload").onclick = () => location.reload();
        const heartbeat = async () => {
          if (completed || !room || (entered && !gameConnected)) return;
          try {
            const state = await api("/api/match/heartbeat", {
              method: "POST",
              body: JSON.stringify({ roomCode: room, connectionId }),
            });
            updateLifecycle(state);
          } catch (error) {
            lifecycleFault = error.message;
            renderLifecycle();
          }
        };
        const showResult = (state) => {
          if (completed) return;
          completed = true;
          clearInterval(lifecycleTimer);
          $("lifecycle-notice").hidden = true;
          presence?.close();
          $("plugin-loader").classList.add("hidden");
          $("surrender-modal").classList.remove("show");
          const won = state.winner === team;
          $("result-modal").dataset.result = state.winner
            ? won
              ? "win"
              : "loss"
            : "neutral";
          $("result-mark").textContent = state.winner
            ? won
              ? "胜"
              : "负"
            : "—";
          $("result-title").textContent = state.winner
            ? won
              ? "战斗胜利"
              : "战斗结束"
            : "战局中断";
          $("result-detail").textContent =
            (state.reason || "战局已结算") +
            (state.winner ? "；经验已经计入个人主页。" : "");
          $("result-modal").classList.add("show");
        };
        const reportGameDisconnect = async () => {
          gameConnected = false;
          if (completed) return;
          try {
            updateLifecycle(
              await api("/api/match/disconnect", {
                method: "POST",
                body: JSON.stringify({ roomCode: room, connectionId }),
              }),
            );
          } catch {
            lifecycleFault =
              "游戏连接已中断且无法联系服务器，请重新加载检查连接。";
            renderLifecycle();
          }
        };
        const markDisconnected = () => {
          if (completed || !room) return;
          presence?.close();
          const body = JSON.stringify({ roomCode: room, connectionId });
          if (navigator.sendBeacon)
            navigator.sendBeacon(
              pluginBase + "/api/match/disconnect",
              new Blob([body], { type: "application/json" }),
            );
          else
            fetch(pluginBase + "/api/match/disconnect", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body,
              credentials: "same-origin",
              keepalive: true,
            }).catch(() => {});
        };
        addEventListener("pagehide", markDisconnected);
        $("continue-battle").onclick = () =>
          $("surrender-modal").classList.remove("show");
        $("confirm-surrender").onclick = async () => {
          try {
            const state = await api("/api/match/surrender", {
              method: "POST",
              body: JSON.stringify({ roomCode: room }),
            });
            showResult(state);
          } catch (error) {
            toast(error.message, true);
          }
        };
        $("return-lobby").onclick = () => location.replace(pluginBase + "/");

        const NativeWebSocket = window.WebSocket;
        class PluginWebSocket extends NativeWebSocket {
          constructor(url, protocols) {
            super(url, protocols);
            this.bridge = QingbeiProtocol.createBridge({
              team,
              send: (raw) => NativeWebSocket.prototype.send.call(this, raw),
              notify: toast,
            });
            this.addEventListener("open", () => {
              gameConnected = true;
              void heartbeat();
            });
            this.addEventListener("message", (event) => {
              if (typeof event.data === "string")
                this.bridge.incoming(event.data);
            });
            this.addEventListener("close", () => {
              if (!completed) void reportGameDisconnect();
            });
          }
          send(data) {
            if (completed) return;
            return this.bridge.outgoing(data);
          }
        }
        window.WebSocket = PluginWebSocket;

        const scanGameUI = () => {
          const stage = document.querySelector(
            ".webgl-stage canvas,.battle-nav",
          );
          if (stage) {
            entered = true;
            $("plugin-loader").classList.add("hidden");
          }
          const lobby = document.querySelector(".team-lobby-card");
          if (lobby && !autoJoined) {
            const input = lobby.querySelector("input");
            if (input && profile?.id && input.value !== profile.id)
              setReactInput(input, profile.id);
            const label = team === "thu" ? "清华大学" : "北京大学",
              button = [...lobby.querySelectorAll("button")].find((item) =>
                item.textContent.includes(label),
              );
            if (button && !button.disabled) {
              autoJoined = true;
              setTimeout(() => button.click(), 80);
            }
          }
          for (const button of document.querySelectorAll("button")) {
            const text = button.textContent.trim();
            if (text === "保存并退出" || text === "退出并保存") {
              button.textContent = "投降";
              button.dataset.pluginSurrender = "1";
              button.classList.add("danger");
            }
            if (button.title === "返回主页面") {
              button.title = "战局菜单";
              button.setAttribute("aria-label", "战局菜单");
            }
          }
          if (
            entered &&
            document.querySelector(".home-screen") &&
            !document.querySelector(".webgl-stage")
          )
            location.reload();
        };
        document.addEventListener(
          "click",
          (event) => {
            const button = event.target.closest?.("button");
            if (!button || button.dataset.pluginSurrender !== "1") return;
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            $("surrender-modal").classList.add("show");
          },
          true,
        );
        new MutationObserver(scanGameUI).observe(document.documentElement, {
          childList: true,
          subtree: true,
          characterData: true,
        });

        const loadGame = async () => {
          const base = "https://very12345.github.io/qingbei-webgl-campaign/";
          $("plugin-loader-status").textContent = "正在展开校园战场";
          const response = await fetch(base + "index.html", {
            cache: "no-store",
          });
          if (!response.ok) throw new Error("游戏资源返回 " + response.status);
          const remote = new DOMParser().parseFromString(
            await response.text(),
            "text/html",
          );
          for (const source of remote.querySelectorAll(
            'link[rel="stylesheet"],link[rel="modulepreload"]',
          )) {
            const link = document.createElement("link");
            for (const attribute of source.attributes)
              link.setAttribute(attribute.name, attribute.value);
            link.href = new URL(source.getAttribute("href"), base).href;
            document.head.appendChild(link);
          }
          const source = remote.querySelector('script[type="module"][src]');
          if (!source) throw new Error("没有找到游戏入口");
          const script = document.createElement("script");
          script.type = "module";
          script.crossOrigin = "anonymous";
          script.src = new URL(source.getAttribute("src"), base).href;
          script.onerror = () => {
            $("plugin-loader-status").textContent =
              "游戏代码加载失败，请刷新重试";
          };
          document.head.appendChild(script);
        };
        (async () => {
          try {
            if (!room || (team !== "pku" && team !== "thu"))
              throw new Error("战局链接无效");
            const result = await api("/api/me");
            profile = result.profile;
            activeMatch = profile.activeMatch;
            if (!activeMatch?.joinUrl) {
              location.replace(pluginBase + "/");
              return;
            }
            if (activeMatch.roomCode !== room || activeMatch.team !== team) {
              location.replace(activeMatch.joinUrl);
              return;
            }
            sessionStorage.setItem("qingbei-player-name", profile.id);
            presence = new EventSource(
              pluginBase +
                "/api/match/presence?room=" +
                encodeURIComponent(room) +
                "&connectionId=" +
                encodeURIComponent(connectionId),
            );
            presence.onmessage = (event) => {
              updateLifecycle(JSON.parse(event.data));
              if (!completed) void heartbeat();
            };
            presence.onerror = () => {
              if (!completed) {
                lifecycleFault =
                  "对局服务暂时不可达，正在重新连接；断线超过60秒可能判负。";
                renderLifecycle();
              }
            };
            presence.addEventListener("replaced", () => {
              completed = true;
              presence.close();
              $("plugin-loader").classList.add("hidden");
              $("result-mark").textContent = "↗";
              $("result-title").textContent = "已在另一个页面继续";
              $("result-detail").textContent =
                "请在新页面操作，本页面不再发送命令。";
              $("result-modal").classList.add("show");
            });
            await loadGame();
            setTimeout(scanGameUI, 100);
          } catch (error) {
            $("plugin-loader-status").textContent = error.message;
            setTimeout(() => location.replace(pluginBase + "/"), 1800);
          }
        })();
      })();
    </script>
  </body>
</html>
