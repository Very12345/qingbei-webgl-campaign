<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07101c" />
  <title>解放清华园 · 插件战局</title>
  <style>
    *{box-sizing:border-box}html,body,#root{width:100%;height:100%;margin:0;background:#07101c}button{font:inherit}.team-lobby-card,.home-screen{visibility:hidden}
    #plugin-loader{position:fixed;z-index:999999;inset:0;display:grid;place-items:center;background:#d9253f;color:#fff;font-family:"Microsoft YaHei",system-ui,sans-serif;transition:opacity .25s ease,visibility .25s ease}
    #plugin-loader.hidden{opacity:0;visibility:hidden}#plugin-loader>div{display:grid;width:min(480px,82vw);gap:17px;text-align:center}#plugin-loader strong{font-size:clamp(30px,6vw,55px);letter-spacing:.12em;text-shadow:0 5px 0 #801023}#plugin-loader small{font-weight:800;letter-spacing:.12em}#plugin-loader i{display:block;height:10px;border:3px solid #fff;background:linear-gradient(90deg,#fff 0 38%,#8e1428 38%);animation:progress 1.1s ease-in-out infinite alternate}@keyframes progress{to{background:linear-gradient(90deg,#fff 0 86%,#8e1428 86%)}}
    .plugin-toast{position:fixed;z-index:1000001;top:80px;left:50%;max-width:min(560px,88vw);transform:translate(-50%,-20px);padding:10px 16px;border:1px solid #ebcf72;border-radius:99px;background:#101b18f2;color:#ffe9a6;font:800 13px/1.4 "Microsoft YaHei",system-ui,sans-serif;box-shadow:0 12px 40px #000b;opacity:0;pointer-events:none;transition:.18s}.plugin-toast.show{transform:translate(-50%,0);opacity:1}.plugin-toast.error{border-color:#e6475d;color:#ffbec7}
    .plugin-modal{position:fixed;z-index:1000002;inset:0;display:none;place-items:center;padding:20px;background:#020708d9;backdrop-filter:blur(9px);font-family:"Microsoft YaHei",system-ui,sans-serif}.plugin-modal.show{display:grid}.plugin-card{display:grid;width:min(520px,94vw);gap:14px;padding:24px;border:2px solid #e3c765;border-radius:14px;background:#0d1915;color:#f4edd3;box-shadow:0 28px 90px #000}.plugin-card h2{margin:0;color:#ffe39a;font-size:28px}.plugin-card p{margin:0;color:#bfc8bc}.plugin-card .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}.plugin-card button{min-height:44px;padding:8px 16px;border:1px solid #d8bd63;border-radius:8px;background:#26322c;color:#ffe8a1;font-weight:900;cursor:pointer}.plugin-card button.danger{border-color:#ef5368;background:#7f1f31;color:#fff}.plugin-result .result-mark{font-size:58px;text-align:center}.plugin-result h2,.plugin-result p{text-align:center}.plugin-result .actions{justify-content:center}
  </style>
</head>
<body>
  <div id="plugin-loader" role="status"><div><strong>解放清华园</strong><small id="plugin-loader-status">正在验证账号与战局</small><i aria-hidden="true"></i></div></div>
  <div id="root"></div>
  <aside class="plugin-toast" id="plugin-toast" role="status"></aside>
  <div class="plugin-modal" id="surrender-modal"><section class="plugin-card"><small>战局操作</small><h2>确认投降？</h2><p>投降会立即判定对方获胜并结算经验。关闭窗口则有60秒返回宽限。</p><div class="actions"><button id="continue-battle">继续战斗</button><button class="danger" id="confirm-surrender">确认投降</button></div></section></div>
  <div class="plugin-modal plugin-result" id="result-modal"><section class="plugin-card"><div class="result-mark" id="result-mark">胜</div><h2 id="result-title">战局结束</h2><p id="result-detail"></p><div class="actions"><button id="return-lobby">返回个人主页</button></div></section></div>
  <script src="../protocol.js"></script>
  <script>
  (()=>{
    const params=new URLSearchParams(location.search),room=(params.get('join')||'').replace(/[^a-z0-9]/gi,'').toUpperCase(),team=params.get('pluginTeam'),pluginBase=location.pathname.replace(/\/play\/$/,''),connectionId=Array.from(crypto.getRandomValues(new Uint32Array(4)),n=>n.toString(16)).join('-');let profile=null,activeMatch=null,entered=false,completed=false,autoJoined=false,toastTimer=0,presence=null;
    const $=id=>document.getElementById(id),api=async(path,options={})=>{const response=await fetch(pluginBase+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'请求失败');return data};
    const toast=(text,error=false)=>{const node=$('plugin-toast');node.textContent=text;node.classList.toggle('error',error);node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),2600)};
    const setReactInput=(input,value)=>{const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value')?.set;setter?.call(input,value);input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}))};
    const heartbeat=async()=>{if(completed||!room)return;try{const state=await api('/api/match/heartbeat',{method:'POST',body:JSON.stringify({roomCode:room,connectionId})});if(state.completed)showResult(state)}catch(error){toast(error.message,true)}};
    const showResult=state=>{if(completed)return;completed=true;presence?.close();$('plugin-loader').classList.add('hidden');$('surrender-modal').classList.remove('show');const won=state.winner===team;$('result-mark').textContent=state.winner?(won?'胜':'负'):'—';$('result-title').textContent=state.winner?(won?'战斗胜利':'战斗结束'):'战局中断';$('result-detail').textContent=(state.reason||'战局已结算')+(state.winner?'；经验已经计入个人主页。':'');$('result-modal').classList.add('show')};
    const markDisconnected=()=>{if(completed||!room)return;presence?.close();const body=JSON.stringify({roomCode:room,connectionId});if(navigator.sendBeacon)navigator.sendBeacon(pluginBase+'/api/match/disconnect',new Blob([body],{type:'application/json'}));else fetch(pluginBase+'/api/match/disconnect',{method:'POST',headers:{'Content-Type':'application/json'},body,credentials:'same-origin',keepalive:true}).catch(()=>{})};
    addEventListener('pagehide',markDisconnected);
    $('continue-battle').onclick=()=>$('surrender-modal').classList.remove('show');$('confirm-surrender').onclick=async()=>{try{const state=await api('/api/match/surrender',{method:'POST',body:JSON.stringify({roomCode:room})});showResult(state)}catch(error){toast(error.message,true)}};$('return-lobby').onclick=()=>location.replace(pluginBase+'/');

    const NativeWebSocket=window.WebSocket;
    class PluginWebSocket extends NativeWebSocket{
      constructor(url,protocols){super(url,protocols);this.bridge=QingbeiProtocol.createBridge({send:raw=>NativeWebSocket.prototype.send.call(this,raw),notify:toast});this.addEventListener('message',event=>{if(typeof event.data==='string')this.bridge.incoming(event.data)});this.addEventListener('close',()=>{if(!completed){markDisconnected();toast('游戏连接已断开，请在60秒内刷新返回',true)}})}
      send(data){if(completed)return;return this.bridge.outgoing(data)}
    }
    window.WebSocket=PluginWebSocket;

    const scanGameUI=()=>{const stage=document.querySelector('.webgl-stage canvas,.battle-nav');if(stage){entered=true;$('plugin-loader').classList.add('hidden')}const lobby=document.querySelector('.team-lobby-card');if(lobby&&!autoJoined){const input=lobby.querySelector('input');if(input&&profile?.id&&input.value!==profile.id)setReactInput(input,profile.id);const label=team==='thu'?'清华大学':'北京大学',button=[...lobby.querySelectorAll('button')].find(item=>item.textContent.includes(label));if(button&&!button.disabled){autoJoined=true;setTimeout(()=>button.click(),80)}}for(const button of document.querySelectorAll('button')){const text=button.textContent.trim();if(text==='保存并退出'||text==='退出并保存'){button.textContent='投降';button.dataset.pluginSurrender='1';button.classList.add('danger')}if(button.title==='返回主页面'){button.title='战局菜单';button.setAttribute('aria-label','战局菜单')}}if(entered&&document.querySelector('.home-screen')&&!document.querySelector('.webgl-stage'))location.reload()};
    document.addEventListener('click',event=>{const button=event.target.closest?.('button');if(!button||button.dataset.pluginSurrender!=='1')return;event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();$('surrender-modal').classList.add('show')},true);
    new MutationObserver(scanGameUI).observe(document.documentElement,{childList:true,subtree:true,characterData:true});

    const loadGame=async()=>{const base='https://very12345.github.io/qingbei-webgl-campaign/';$('plugin-loader-status').textContent='正在加载统一游戏客户端';const response=await fetch(base+'index.html',{cache:'no-store'});if(!response.ok)throw new Error('游戏资源返回 '+response.status);const remote=new DOMParser().parseFromString(await response.text(),'text/html');for(const source of remote.querySelectorAll('link[rel="stylesheet"],link[rel="modulepreload"]')){const link=document.createElement('link');for(const attribute of source.attributes)link.setAttribute(attribute.name,attribute.value);link.href=new URL(source.getAttribute('href'),base).href;document.head.appendChild(link)}const source=remote.querySelector('script[type="module"][src]');if(!source)throw new Error('没有找到游戏入口');const script=document.createElement('script');script.type='module';script.crossOrigin='anonymous';script.src=new URL(source.getAttribute('src'),base).href;script.onerror=()=>{$('plugin-loader-status').textContent='游戏代码加载失败，请刷新重试'};document.head.appendChild(script)};
    (async()=>{try{if(!room||(team!=='pku'&&team!=='thu'))throw new Error('战局链接无效');const result=await api('/api/me');profile=result.profile;activeMatch=profile.activeMatch;if(!activeMatch?.joinUrl){location.replace(pluginBase+'/');return}if(activeMatch.roomCode!==room||activeMatch.team!==team){location.replace(activeMatch.joinUrl);return}sessionStorage.setItem('qingbei-player-name',profile.id);
      presence=new EventSource(pluginBase+'/api/match/presence?room='+encodeURIComponent(room)+'&connectionId='+encodeURIComponent(connectionId));
      presence.onmessage=event=>{const state=JSON.parse(event.data);if(state.completed)showResult(state);else void heartbeat()};
      presence.onerror=()=>{if(!completed)toast('连接中断，正在恢复；断线超过60秒将判负',true)};
      presence.addEventListener('replaced',()=>{completed=true;presence.close();$('plugin-loader').classList.add('hidden');$('result-mark').textContent='↗';$('result-title').textContent='已在另一个页面继续';$('result-detail').textContent='请在新页面操作，本页面不再发送命令。';$('result-modal').classList.add('show')});
      await loadGame();setTimeout(scanGameUI,100)}catch(error){$('plugin-loader-status').textContent=error.message;setTimeout(()=>location.replace(pluginBase+'/'),1800)}})();
  })();
  </script>
</body>
</html>
