name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:kernel
      - run: npm run verify:ai
      - run: npm run build
      - run: cp VERSION dist/VERSION
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Build CDN server mirrors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          version=$(tr -d '\r\n' < VERSION)
          target_dir="dist/downloads/$version"
          mkdir -p "$target_dir"
          cd native-server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$version" -o "../$target_dir/qingbei-server-windows-amd64.exe" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$version" -o "../$target_dir/qingbei-server-linux-amd64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$version" -o "../$target_dir/qingbei-server-darwin-amd64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$version" -o "../$target_dir/qingbei-server-darwin-arm64" .
          upx --best "../$target_dir/qingbei-server-windows-amd64.exe"
          upx --best "../$target_dir/qingbei-server-linux-amd64"
          cd ..
          for file in "$target_dir"/qingbei-server-*; do
            sha256sum "$file" > "$file.sha256"
            cp "$file" dist/downloads/
            cp "$file.sha256" dist/downloads/
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
