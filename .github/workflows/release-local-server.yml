name: Release local server

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Build server
        working-directory: native-server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          output="../qingbei-server-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$output" .
          cd ..
          sha256sum "$(basename "$output")" > "$(basename "$output").sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: qingbei-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            qingbei-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
            qingbei-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}.sha256

  wait-for-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching web deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            result=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow pages.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | [.status, .conclusion] | @tsv')
            status=$(printf '%s' "$result" | cut -f1)
            conclusion=$(printf '%s' "$result" | cut -f2)
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              echo "Matching GitHub Pages deployment succeeded."
              exit 0
            fi
            if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
              echo "Matching GitHub Pages deployment failed: $conclusion"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for matching GitHub Pages deployment."
          exit 1

  release:
    needs: [build, wait-for-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
