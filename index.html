<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07101c" />
    <meta name="description" content="解放清华园 WebGL 实时校园战略游戏" />
    <title>解放清华园｜WebGL实时战略版</title>
    <style>
      #boot-loader{position:fixed;z-index:99999;inset:0;display:grid;place-items:center;background:#d9253f;color:#fff;font-family:"Microsoft YaHei",system-ui,sans-serif;transition:opacity .28s ease,visibility .28s ease}
      #boot-loader.boot-loader-hidden{visibility:hidden;opacity:0}
      .boot-loader-inner{display:grid;width:min(420px,72vw);justify-items:center;gap:24px}
      .boot-loader-title{font-size:clamp(28px,5vw,52px);font-weight:1000;letter-spacing:.16em;text-shadow:0 4px 0 #7e1022}
      .boot-loader-subtitle{margin-top:-17px;font-size:12px;font-weight:800;letter-spacing:.35em;opacity:.82}
      .boot-loader-track{width:100%;height:12px;border:3px solid #fff;background:#8e1428;box-shadow:0 5px 0 #7e1022}
      .boot-loader-progress{height:100%;width:34%;background:#fff;animation:boot-progress 1.15s cubic-bezier(.65,0,.35,1) infinite}
      @keyframes boot-progress{0%{transform:translateX(-110%)}100%{transform:translateX(295%)}}
      @media(prefers-reduced-motion:reduce){.boot-loader-progress{width:72%;animation:none}}
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <div class="boot-loader-inner">
        <div class="boot-loader-title">解放清华园</div>
        <div class="boot-loader-subtitle">正在加载战场</div>
        <div class="boot-loader-track"><div class="boot-loader-progress"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
